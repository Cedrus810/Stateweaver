[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sroqm"
version = "0.1.0"
description = "Stateful reduced-order QM engine for QM/MM (PySCF backend)"
requires-python = ">=3.12"
dependencies = ["pyscf>=2.14", "numpy>=2.0", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "benchmarks"]
testpaths = ["tests"]
filterwarnings = ["ignore:using cupy:UserWarning"]
